# scripts/export-public reads this file. It is private: the export leaves it
# and the script out of the public tree.

# The product name: the root Cargo package (or package.json) and the public
# commit message.
NAME=__NAME__

# The author of the public commits, unless EXPORT_AUTHOR is set. Use the GitHub
# noreply address, never a personal one.
AUTHOR="__AUTHOR__"

# What never goes public. Globs are expanded in the exported tree.
EXCLUDE=(
    .claude
    docs/PLAN.md
    docs/plans
    docs/handoffs
)

# More private traces, as one extended regex: the private repository's name,
# other machines' paths. The script already refuses $HOME, /home/$USER/,
# /Users/$USER/, your git email and claude.ai session links.
PERSONAL='__PRIVATE_REPO__([^-a-z]|$)'
