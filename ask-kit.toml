id = "temet.release"
name = "release"
version = "0.1.0"
min_ask_kit = "0.2.0"
requires = ["git", "node"]
says = "how close a repository is to a public release and where a release stands: is it release-ready, what is missing (licence, notices, README, SECURITY, CONTRIBUTING, CI, release workflow, gitignore, public/private split), does the version agree in package.json, Cargo.toml, plugin manifests, server.json and the changelog, what the latest tag and the published npm, crate and GitHub release are, is this all released or deployed, what is unreleased since the last tag, is there a changelog entry, does the package ship what it should, does anything look like a secret or a private word in the tree or the history before it goes public; and preparing a release (add a missing file from the skill's templates, set the version, write the changelog entry, create the tag; push the tag or publish only when the request names the version)"
keywords = ["release", "released", "unreleased", "release-ready", "ready to (publish|ship|release|go public)", "go(ing)? public", "open-?source", "publish(ed)?", "npm view", "latest (tag|release|version)", "changelog", "release notes", "version bump", "bump the version", "tag(ged)?", "licen[cs]e", "notices", "secret scan", "private words?", "homebrew", "is (this|it) (all )?deployed", "what('s| is) unreleased", "SECURITY\\.md", "CONTRIBUTING"]
patterns = ['\brelease[- ]ready\b', '\bunreleased\b']
route_hint = "whether a repository is ready for a public release, what an npm publish would ship, whether its version is the same in every manifest and tag, what the last release was and what is unreleased since, what is published on npm, crates.io or GitHub releases, secret and private-word scans before going public, and preparing, tagging or publishing a release are release; commits, branches and history in general are git; CI runs, pull requests and a repository's issues are github; running a package's tests, typecheck and build is tests, its dependencies are deps, and Rust builds and tests are rust; whether docs match code is docs-check; whether a deployed service is running (a server, a container, a timer) is ops or systemd; what a past session did is sessions or mike"
cite = "`path:line` for the file that fails a check, a short commit sha or tag name, and `name@version` for what is published"
instructions = "instructions.md"
state_key = "${REPO_ROOT}"
acts = [
  "release.addFile",
  "release.scaffold",
  "release.setVersion",
  "release.writeChangelog",
  "release.tag",
  "release.pushTag",
  "release.publish",
  "release.githubRelease",
  "release.setReleaseNotes",
  "repo.edit",
  "repo.write",
  "repo.run",
]

[[settings]]
key = "REPO_ROOT"
about = "the repository to answer about; found from the folder the agent works in"
detect = ["git", "rev-parse", "--show-toplevel"]

[[settings]]
key = "PRIVATE_WORDS"
about = "the private-word list for the private-word check: a file with one extended regex per line, kept outside every repository. The words are never printed. Without it that check reports not run."

[[settings]]
key = "TEMPLATES"
about = "a folder of release files (LICENSE, SECURITY.md, CONTRIBUTING.md, workflows and the like) that missing files are copied from; the __NAME__, __ORG__, __HOLDER__, __YEAR__, __AUTHOR__ and __DESC__ markers in them are filled in. Without it nothing can be added from templates."

[[settings]]
key = "SCAFFOLD"
about = "optional: a Python script that adds every missing template to a repository (called with the repository folder, --name and --dry-run). Without it only single templates can be added."

[[settings]]
key = "TIMEZONE"
about = "the time zone (an IANA name such as Europe/Paris) in which dates are given to the caller; default is the machine's"

[[sources]]
kind = "module"
name = "release"
module = "release.mjs"
api = "api.d.ts"

[[sources]]
kind = "folder"
name = "repo"
path = "${REPO_ROOT}"
about = "the repository: its manifests, workflows, docs and git history; read only unless the ask may change things"
# What the investigator reads goes to a model: credentials, keys and build output are never searched or read.
exclude = [
  ".env", ".env.*", "*.env", ".npmrc", ".yarnrc", ".yarnrc.yml", ".netrc", ".pypirc", "*.pem", "*.key", "*.p12", "*.pfx", "id_rsa*", "id_ed25519*", "*credential*", "*secret*", "*token*", "*cookie*", "auth.json",
  "node_modules/**", "**/node_modules/**", "target/**", "dist/**", "build/**", "out/**", "coverage/**", ".git/**", ".venv/**", "venv/**", "__pycache__/**",
  "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb", "Cargo.lock", "*.min.js", "*.map",
]

[[roles]]
name = "auditor"
when = "a question about whether a repository is ready for release or public, what blocks it, what a release or tag currently is, what is published, what is unreleased, or whether the versions agree"
patterns = ["\\b(release[- ]ready|ready (to|for) (release|publish|ship|go public|public)|go(ing)? public|open[- ]?sourc)", "\\bunreleased\\b", "\\b(is|are) (this|it|everything) (all )?(released|published|deployed)\\b", "\\b(latest|last) (tag|release|version)\\b", "\\bnpm view\\b"]
instructions = "roles/auditor.md"

[[roles]]
name = "releaser"
when = "a request to prepare or cut a release: set the version, write the changelog entry, add a missing release file, create the tag, and, only when the request names the version, push the tag or publish"
patterns = ["^(please )?(cut|prepare|make|do|ship|publish|tag|bump|release)\\b.*\\b(release|version|tag|changelog|npm|publish)\\b", "\\b(bump|set) the version\\b", "\\bcreate (the|a) tag\\b"]
instructions = "roles/releaser.md"
